<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фотоконтроль авто</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffd600;
            --success: #4caf50;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px; /* Место под нижнюю панель */
        }

        /* Шапка */
        header {
            padding: 24px 20px 16px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 10;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.4;
        }

        /* Сетка карточек */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px 20px;
        }

        /* Карточка */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            position: relative;
            aspect-ratio: 4 / 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
            border: 1px solid transparent;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card.done {
            border-color: var(--success);
        }

        .card.done::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--success);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 2;
        }

        .card.done .card-label {
            color: var(--text-muted);
        }

        .card.done .icon-camera {
            opacity: 0.1;
        }

        .card-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Иконка камеры-заглушки */
        .icon-camera {
            width: 32px;
            height: 32px;
            opacity: 0.3;
            margin-bottom: 15px;
        }

        /* Фейковое фото для демонстрации */
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card.done .card-img {
            opacity: 1;
        }

        /* Нижняя панель */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-color);
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .btn {
            flex: 1;
            height: 56px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: #2c2c2c;
            color: white;
        }

        .btn-primary {
            background-color: var(--accent);
            color: black;
        }

        .btn-primary:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1>Фотоконтроль<br>машины</h1>
        <div class="subtitle">Сделайте 9 фото, чтобы менеджер подтвердил состояние автомобиля.</div>
    </header>

    <div class="grid" id="grid">
        <!-- Карточки генерируются скриптом -->
    </div>

    <div class="bottom-bar">
        <button class="btn btn-secondary" onclick="alert('Сброс макета')">Назад</button>
        <button class="btn btn-primary" id="btn-send" disabled onclick="alert('Отправка на сервер...')">Отправить</button>
    </div>

    <script>
        // Список наших 9 ракурсов
        const angles = [
            { id: 'front', label: 'Спереди' },
            { id: 'back', label: 'Сзади' },
            { id: 'left', label: 'Слева' },
            { id: 'right', label: 'Справа' },
            { id: 'trunk', label: 'Багажник' },
            { id: 'interior_front', label: 'Салон (перед)' },
            { id: 'interior_back', label: 'Салон (зад)' },
            { id: 'mileage', label: 'Пробег' },
            { id: 'oil', label: 'Уровень масла' }
        ];

        const grid = document.getElementById('grid');
        const btnSend = document.getElementById('btn-send');
        let doneCount = 0;

        // SVG иконка камеры
        const cameraSvg = `<svg class="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>`;

        // Отрисовка карточек
        angles.forEach(angle => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${angle.id}`;
            
            // Заглушка картинки (пока не нажата)
            card.innerHTML = `
                ${cameraSvg}
                <div class="card-label">${angle.label}</div>
            `;

            // Клик по карточке (эмуляция фото)
            card.addEventListener('click', () => {
                if (!card.classList.contains('done')) {
                    // Ставим рандомную картинку с интернета для демо
                    const img = document.createElement('img');
                    img.src = `https://picsum.photos/seed/${angle.id}/400/300`;
                    img.className = 'card-img';
                    card.appendChild(img);
                    
                    setTimeout(() => {
                        card.classList.add('done');
                        doneCount++;
                        updateProgress();
                    }, 100);
                } else {
                    // Если уже сфоткано - можно переснять
                    if(confirm('Переснять этот ракурс?')) {
                        card.classList.remove('done');
                        const img = card.querySelector('.card-img');
                        if(img) img.remove();
                        doneCount--;
                        updateProgress();
                    }
                }
            });

            grid.appendChild(card);
        });

        // Обновление прогресса и кнопки
        function updateProgress() {
            if (doneCount === angles.length) {
                btnSend.disabled = false;
            } else {
                btnSend.disabled = true;
            }
        }
    </script>
</body>
</html>
